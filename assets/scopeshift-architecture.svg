<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      @keyframes pingDot {
        0% { r: 3.5; opacity: 1; }
        75%, 100% { r: 8; opacity: 0; }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .node-pulse {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .ping-circle {
        animation: pingDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; line-height: 1.4; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; }
    </style>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="920" height="270" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.2"/>
  
  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="270"/>
    <line x1="261" y1="0" x2="261" y2="270"/>
    <line x1="482" y1="0" x2="482" y2="270"/>
    <line x1="703" y1="0" x2="703" y2="270"/>
    <line x1="0" y1="56" x2="920" y2="56"/>
    <line x1="0" y1="220" x2="920" y2="220"/>
  </g>

  <!-- Top Metadata Track -->
  <text x="42" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">SCOPESHIFT DETERMINISTIC GOVERNANCE ENGINE</text>
  
  <rect x="714" y="22" width="164" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="728" cy="34" r="3.5" fill="#10b981"/>
  <circle cx="728" cy="34" r="3.5" fill="#10b981" class="ping-circle"/>
  <text x="739" y="38" class="badge-text" fill="#065f46">INVARIANT: ENFORCED</text>

  <!-- Flow Connectors -->
  <!-- 1 -> 2 -->
  <line x1="215" y1="138" x2="261" y2="138" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="215" y1="138" x2="261" y2="138" stroke="#3b82f6" stroke-width="2" class="flow-line"/>

  <!-- 2 -> 3 -->
  <line x1="436" y1="138" x2="482" y2="138" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="436" y1="138" x2="482" y2="138" stroke="#10b981" stroke-width="2" class="flow-line"/>

  <!-- 3 -> 4 -->
  <line x1="657" y1="138" x2="703" y2="138" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="657" y1="138" x2="703" y2="138" stroke="#6366f1" stroke-width="2" class="flow-line"/>

  <!-- ==================== CARD 1: INGESTION ==================== -->
  <g transform="translate(40, 58)">
    <rect width="175" height="160" rx="10" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <!-- Icon: Document & Scan -->
    <path d="M25 27h16M25 32h11M25 37h14" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
    
    <text x="16" y="74" class="title-text">1. Evidence Ingestion</text>
    <text x="16" y="93" class="sub-text">Extracts claims from</text>
    <text x="16" y="108" class="sub-text">PDFs, PNGs &amp; client notes</text>

    <rect x="16" y="124" width="106" height="20" rx="4" fill="#eff6ff"/>
    <text x="22" y="138" class="badge-text" fill="#1d4ed8">GEMINI 2.5 FLASH</text>
  </g>

  <!-- ==================== CARD 2: CITATION GATE ==================== -->
  <g transform="translate(261, 58)">
    <rect width="175" height="160" rx="10" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <!-- Icon: Shield Check -->
    <path d="M33 24l-8 3.5v7c0 5 4 9 8 10 4-1 8-5 8-10v-7l-8-3.5z" stroke="#059669" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M29 34l3 3 5-5" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="16" y="74" class="title-text">2. Citation Gate</text>
    <text x="16" y="93" class="sub-text">Verbatim text matching &amp;</text>
    <text x="16" y="108" class="sub-text">coordinate boundaries</text>

    <rect x="16" y="124" width="108" height="20" rx="4" fill="#ecfdf5"/>
    <text x="22" y="138" class="badge-text" fill="#047857">FAIL-CLOSED CHECK</text>
  </g>

  <!-- ==================== CARD 3: IMMUTABLE LEDGER ==================== -->
  <g transform="translate(482, 58)">
    <rect width="175" height="160" rx="10" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <!-- Icon: Blockchain Links -->
    <circle cx="28" cy="33" r="3.5" stroke="#4f46e5" stroke-width="1.6"/>
    <circle cx="38" cy="33" r="3.5" stroke="#4f46e5" stroke-width="1.6"/>
    <line x1="31.5" y1="33" x2="34.5" y2="33" stroke="#4f46e5" stroke-width="1.6"/>

    <text x="16" y="74" class="title-text">3. Event Ledger</text>
    <text x="16" y="93" class="sub-text">Monotonic ordering &amp;</text>
    <text x="16" y="108" class="sub-text">SHA-256 hash chains</text>

    <rect x="16" y="124" width="112" height="20" rx="4" fill="#eef2ff"/>
    <text x="22" y="138" class="badge-text" fill="#4338ca">ATOMIC AUDIT LOG</text>
  </g>

  <!-- ==================== CARD 4: DETERMINISTIC RESOLVER & BRD ==================== -->
  <g transform="translate(703, 58)">
    <rect width="175" height="160" rx="10" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
    <!-- Icon: Checkmark Seal -->
    <path d="M26 33l5 5 10-10" stroke="#db2777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="33" r="10" stroke="#db2777" stroke-width="1.5" stroke-dasharray="2 2"/>

    <text x="16" y="74" class="title-text">4. Governed BRD</text>
    <text x="16" y="93" class="sub-text">Deterministic resolver &amp;</text>
    <text x="16" y="108" class="sub-text">verified scope projection</text>

    <rect x="16" y="124" width="118" height="20" rx="4" fill="#fdf2f8"/>
    <text x="22" y="138" class="badge-text" fill="#9d174d">ZERO DRIFT SPEC</text>
  </g>
</svg>
